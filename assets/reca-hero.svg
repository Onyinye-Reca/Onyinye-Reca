<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="rh-title rh-desc">
  <title id="rh-title">Onyinyechi Obiajuru</title>
  <desc id="rh-desc">Backend engineer working on payments and APIs in Lagos, Nigeria.</desc>
  <defs>
    <linearGradient id="rh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1210"/>
      <stop offset="0.55" stop-color="#12201B"/>
      <stop offset="1" stop-color="#0B1210"/>
    </linearGradient>
    <radialGradient id="rh-glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2F7A5B" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2F7A5B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rh-glow-amber" cx="0.08" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#E0A33A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#E0A33A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rh-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1E3A2F" stroke-width="1"/>
    </pattern>
    <linearGradient id="rh-grid-fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
    <mask id="rh-grid-mask">
      <rect width="1000" height="300" fill="url(#rh-grid-fade)"/>
    </mask>
    <linearGradient id="rh-sweep-grad" x1="0" x2="1">
      <stop offset="0" stop-color="#F7F3EA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F7F3EA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F7F3EA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rh-underline" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="360" y2="0">
      <stop offset="0" stop-color="#E0A33A"/>
      <stop offset="1" stop-color="#F2D49B" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="rh-blur" filterUnits="userSpaceOnUse" x="40" y="160" width="350" height="40">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="rh-node-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="rh-clip">
      <rect width="1000" height="300" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .rh-sweep { animation: rh-sweep 10s ease-in-out infinite; }
    @keyframes rh-sweep { from { transform: translateX(-420px); } to { transform: translateX(1100px); } }

    .rh-draw { stroke-dasharray: 300; animation: rh-draw 1.6s 0.5s ease-out both; }
    @keyframes rh-draw { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }

    .rh-flow { stroke-dasharray: 5 15; animation: rh-flow 2.4s linear infinite; }
    .rh-d1 { animation-delay: -0.6s; } .rh-d2 { animation-delay: -1.2s; } .rh-d3 { animation-delay: -1.8s; }
    @keyframes rh-flow { to { stroke-dashoffset: -40; } }

    .rh-pulse { transform-box: fill-box; transform-origin: center; animation: rh-pulse 3.2s ease-in-out infinite; }
    @keyframes rh-pulse { 0%, 100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.7); } }

    .rh-orbit { transform-origin: 820px 150px; animation: rh-orbit 40s linear infinite; }
    @keyframes rh-orbit { to { transform: rotate(360deg); } }

    .rh-rise { animation: rh-rise 0.9s ease-out both; }
    .rh-r1 { animation-delay: 0.1s; } .rh-r2 { animation-delay: 0.25s; } .rh-r3 { animation-delay: 0.9s; } .rh-r4 { animation-delay: 1.1s; }
    @keyframes rh-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .rh-sweep, .rh-flow, .rh-pulse, .rh-orbit, .rh-draw, .rh-rise { animation: none; }
    }
  </style>

  <g clip-path="url(#rh-clip)">
    <rect width="1000" height="300" fill="url(#rh-bg)"/>
    <rect width="1000" height="300" fill="url(#rh-grid)" mask="url(#rh-grid-mask)" opacity="0.6"/>
    <rect width="1000" height="300" fill="url(#rh-glow)"/>
    <rect width="1000" height="300" fill="url(#rh-glow-amber)"/>
    <rect class="rh-sweep" x="0" y="0" width="360" height="300" fill="url(#rh-sweep-grad)"/>

    <g class="rh-orbit">
      <ellipse cx="820" cy="150" rx="102" ry="40" fill="none" stroke="#2F7A5B" stroke-opacity="0.45" stroke-dasharray="2 7"/>
      <circle cx="922" cy="150" r="2.5" fill="#F2D49B"/>
    </g>

    <g fill="none" stroke="#1E3A2F" stroke-width="1.5">
      <path id="rh-e1" d="M690 105 Q 750 115 820 150"/>
      <path id="rh-e2" d="M800 62 Q 805 110 820 150"/>
      <path id="rh-e3" d="M925 110 Q 870 120 820 150"/>
      <path id="rh-e4" d="M735 220 Q 770 175 820 150"/>
      <path id="rh-e5" d="M870 235 Q 840 200 820 150"/>
      <path id="rh-e6" d="M955 190 Q 890 175 820 150"/>
      <path d="M690 105 Q 700 170 735 220"/>
      <path d="M925 110 Q 950 150 955 190"/>
      <path d="M800 62 Q 870 70 925 110"/>
    </g>
    <g fill="none" stroke="#E0A33A" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
      <use href="#rh-e1" class="rh-flow"/>
      <use href="#rh-e3" class="rh-flow rh-d1"/>
      <use href="#rh-e4" class="rh-flow rh-d2"/>
      <use href="#rh-e6" class="rh-flow rh-d3"/>
    </g>

    <g fill="#12201B" stroke="#2F7A5B" stroke-width="1.5">
      <circle cx="690" cy="105" r="5"/>
      <circle cx="800" cy="62" r="5"/>
      <circle cx="925" cy="110" r="5"/>
      <circle cx="735" cy="220" r="5"/>
      <circle cx="870" cy="235" r="5"/>
      <circle cx="955" cy="190" r="5"/>
    </g>
    <circle class="rh-pulse" cx="820" cy="150" r="10" fill="none" stroke="#E0A33A" stroke-width="1.2"/>
    <circle cx="820" cy="150" r="9" fill="#E0A33A" opacity="0.45" filter="url(#rh-node-glow)"/>
    <circle cx="820" cy="150" r="7" fill="#0B1210" stroke="#E0A33A" stroke-width="2"/>
    <circle cx="820" cy="150" r="2.5" fill="#F2D49B"/>

    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#2F7A5B" letter-spacing="0.5">
      <text x="640" y="92">POST /pay</text>
      <text x="812" y="50">webhook</text>
      <text x="935" y="104">verify</text>
      <text x="694" y="244">ledger</text>
      <text x="880" y="258">200 OK</text>
    </g>

    <g fill="none" stroke="#E0A33A" stroke-opacity="0.5" stroke-width="1.5">
      <path d="M20 40V20H40"/>
      <path d="M980 260V280H960"/>
    </g>

    <text class="rh-rise rh-r1" x="64" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#E0A33A">HELLO, I'M RECA</text>
    <text class="rh-rise rh-r2" x="62" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F7F3EA">Onyinyechi Obiajuru</text>

    <path d="M64 180H360" stroke="#E0A33A" stroke-width="6" stroke-linecap="round" opacity="0.35" filter="url(#rh-blur)" class="rh-draw"/>
    <path d="M64 180H360" stroke="url(#rh-underline)" stroke-width="3" stroke-linecap="round" class="rh-draw"/>

    <text class="rh-rise rh-r3" x="64" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#F2D49B">Backend Engineer  ·  Payments &amp; APIs  ·  Lagos, Nigeria</text>
    <text class="rh-rise rh-r4" x="64" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#8FA89B">software engineer and sociologist</text>
  </g>
</svg>
